<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMPM's Hub</title>
    <link rel="icon" type="image/png" href="icon.png">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #4A3525 0%, #2C1D11 100%);
            color: white;
            min-height: 200vh; 
            margin: 0;
            display: flex;
            flex-direction: column;
        }
        /* Top Navigation Bar */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 25px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            width: 100%;
            box-sizing: border-box;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
            transition: top 0.3s ease-in-out;
        }
        .navbar-hidden {
            top: -80px;
        }
        .nav-left {
            display: flex;
            align-items: center;
        }
        .navbar img {
            width: 48px;
            height: 48px;
            margin-right: 12px;
            border-radius: 50%; /* Back to circle */
            object-fit: cover;
        }
        .navbar span {
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
        /* Center Buttons in Nav */
        .nav-center {
            display: flex;
            gap: 15px;
        }
        .nav-center a {
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            transition: 0.3s ease;
            font-size: 0.95rem;
        }
        .nav-center a:hover {
            background: rgba(255, 255, 255, 0.25);
        }
        .nav-right { width: 150px; }

        /* Main Content Area */
        .content {
            flex: 1;
            display: flex;
            justify-content: center; /* Horizontally centers the card */
            align-items: center; /* Vertically centers everything on the page */
            width: 100%;
            padding-top: 80px; /* Navbar offset */
            box-sizing: border-box;
            position: relative;
        }
        /* The Main Text Card */
        .card {
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            width: 70%;
            max-width: 800px;
            box-sizing: border-box;
            text-align: left;
        }
        
        /* Large Side Buttons (New) */
        .side-btn-container {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .side-btn-container.left { left: 50px; }
        .side-btn-container.right { right: 50px; }

        .side-btn {
            width: 150px;
            height: 80px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: rgba(255, 255, 255, 0.6);
            font-weight: bold;
            text-decoration: none;
            transition: 0.3s ease;
            font-size: 1.1rem;
        }
        .side-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
            color: white;
            transform: scale(1.05);
        }

        h1 { margin-top: 0; font-size: 3rem; }
        p { font-size: 1.3rem; opacity: 0.9; line-height: 1.6; margin-bottom: 0;}
    </style>
</head>
<body>
    <!-- Top Bar -->
    <nav class="navbar" id="navbar">
        <div class="nav-left">
            <img src="icon.png" alt="Site Logo">
            <span>AMPM's Hub</span>
        </div>
        <div class="nav-center">
            <a href="#home">Home</a>
            <a href="#test">Test</a>
        </div>
        <div class="nav-right"></div>
    </nav>

    <!-- Center Content -->
    <div class="content" id="home">
        
        <!-- New Left Side Buttons -->
        <div class="side-btn-container left">
            <a href="#" class="side-btn">Button</a>
            <a href="#" class="side-btn">Button</a>
        </div>

        <!-- The Main Card (Centered) -->
        <div class="card">
            <h1>Welcome to AMPM's Hub! 🚀</h1>
            <p>I'm Mohtaram and Born in 2010 and I like drawing and animating in 2D or 3D and i wish to work and become a programmer in the future.</p>
        </div>

        <!-- New Right Side Buttons -->
        <div class="side-btn-container right">
            <a href="#" class="side-btn">Button</a>
            <a href="#" class="side-btn">Button</a>
        </div>
    </div>

    <!-- JavaScript for smart navbar -->
    <script>
        let lastScrollTop = 0;
        const navbar = document.getElementById("navbar");
        window.addEventListener("scroll", function() {
            let scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            if (scrollTop > lastScrollTop && scrollTop > 50) {
                navbar.classList.add("navbar-hidden");
            } else {
                navbar.classList.remove("navbar-hidden");
            }
            lastScrollTop = scrollTop <= 0 ? 0 : scrollTop;
        });
    </script>
</body>
</html>
