<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMPM's Hub</title>
    <link rel="icon" type="image/png" href="icon.png">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #4A3525 0%, #2C1D11 100%);
            color: white;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
        }
        /* Top Navigation Bar */
        .navbar {
            display: flex;
            align-items: center;
            padding: 15px 25px;
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            width: 100%;
            box-sizing: border-box;
            position: fixed;
            top: 0;
            left: 0;
        }
        .navbar img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            margin-right: 12px;
        }
        .navbar span {
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
        /* Main Content Container */
        .content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding-top: 60px;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        h1 { margin-top: 0; font-size: 2.5rem; }
        p { font-size: 1.2rem; opacity: 0.9; }
    </style>
</head>
<body>
    <!-- Top Bar -->
    <nav class="navbar">
        <img src="icon.png" alt="Logo">
        <span>AMPM's Hub</span>
    </nav>

    <!-- Center Card -->
    <div class="content">
        <div class="card">
            <h1>Welcome to AMPM's Hub! 🚀</h1>
            <p>Built with GitHub Pages and looking fresh.</p>
        </div>
    </div>
</body>
</html>
