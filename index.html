<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMPM's Hub</title>
    <link rel="icon" type="image/png" href="icon.png">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #4A3525 0%, #2C1D11 100%);
            color: white;
            min-height: 200vh; 
            margin: 0;
            display: flex;
            flex-direction: column;
            /* Removed align-items: center so content doesn't vertically center on the whole page */
        }
        /* Top Navigation Bar with Scroll Hide/Show Effect */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 25px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            width: 100%;
            box-sizing: border-box;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
            transition: top 0.3s ease-in-out;
        }
        .navbar-hidden {
            top: -80px;
        }
        .nav-left {
            display: flex;
            align-items: center;
        }
        .navbar img {
            width: 48px;
            height: 48px;
            margin-right: 12px;
            object-fit: contain;
        }
        .navbar span {
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
        /* Center Buttons */
        .nav-center {
            display: flex;
            gap: 15px;
        }
        .nav-center a {
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            transition: 0.3s ease;
            font-size: 0.95rem;
        }
        .nav-center a:hover {
            background: rgba(255, 255, 255, 0.25);
        }
        /* Right Spacer */
        .nav-right {
            width: 150px;
        }
        /* Main Content Container */
        .content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start; /* Aligns content to the top instead of stretching/centering vertically */
            width: 100%;
            padding-top: 100px; /* Distance from the navbar */
            padding-bottom: 100px;
            box-sizing: border-box;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            width: 80%;
            max-width: 900px;
            position: relative;
            box-sizing: border-box;
        }
        /* Card Top-Right Icon */
        .card-icon {
            position: absolute;
            top: 25px;
            right: 25px;
            width: 50px;
            height: 50px;
            object-fit: contain;
        }
        h1 { margin-top: 0; font-size: 2.5rem; }
        p { font-size: 1.2rem; opacity: 0.9; }
    </style>
</head>
<body>
    <!-- Top Bar -->
    <nav class="navbar" id="navbar">
        <div class="nav-left">
            <img src="icon.png" alt="Site Logo">
            <span>AMPM's Hub</span>
        </div>
        <div class="nav-center">
            <a href="#home">Home</a>
            <a href="#test">Test</a>
        </div>
        <div class="nav-right"></div>
    </nav>

    <!-- Center Content -->
    <div class="content" id="home">
        <div class="card">
            <img src="icon.png" alt="Card Icon" class="card-icon">
            <h1>Welcome to AMPM's Hub! 🚀</h1>
            <p>Scroll down to test out the smart navbar hiding feature. This container is now cleanly positioned near the top and horizontally centered.</p>
        </div>
    </div>

    <!-- JavaScript to handle the smart scroll hide/show effect for the navbar -->
    <script>
        let lastScrollTop = 0;
        const navbar = document.getElementById("navbar");

        window.addEventListener("scroll", function() {
            let scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            
            if (scrollTop > lastScrollTop && scrollTop > 50) {
                navbar.classList.add("navbar-hidden");
            } else {
                navbar.classList.remove("navbar-hidden");
            }
            lastScrollTop = scrollTop <= 0 ? 0 : scrollTop;
        });
    </script>
</body>
</html>
