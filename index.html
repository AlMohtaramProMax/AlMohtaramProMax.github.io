<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMPM's Hub</title>
    <link rel="icon" type="image/png" href="icon.png">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #4A3525 0%, #2C1D11 100%);
            color: white;
            min-height: 200vh; 
            margin: 0;
            display: flex;
            flex-direction: column;
        }
        /* Top Navigation Bar with Scroll Hide/Show Effect */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 25px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            width: 100%;
            box-sizing: border-box;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
            transition: top 0.3s ease-in-out;
        }
        .navbar-hidden {
            top: -80px;
        }
        .nav-left {
            display: flex;
            align-items: center;
        }
        .navbar img {
            width: 48px;
            height: 48px;
            margin-right: 12px;
            object-fit: contain;
        }
        .navbar span {
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
        /* Center Buttons */
        .nav-center {
            display: flex;
            gap: 15px;
        }
        .nav-center a {
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            transition: 0.3s ease;
            font-size: 0.95rem;
        }
        .nav-center a:hover {
            background: rgba(255, 255, 255, 0.25);
        }
        /* Right Spacer */
        .nav-right {
            width: 150px;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        /* Main Container Layout for Side Panels & Content */
        .main-container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            width: 100%;
            padding-top: 100px; /* Distance from the navbar */
            padding-bottom: 50px;
            box-sizing: border-box;
            gap: 20px;
            padding-left: 20px;
            padding-right: 20px;
        }
        /* Side Columns for Extra Buttons */
        .side-column {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 200px;
            flex-shrink: 0;
        }
        .side-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 2px dashed rgba(255, 255, 255, 0.4);
            color: white;
            padding: 0;
            text-align: center;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            text-decoration: none;
            transition: 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            height: 100px;
            box-sizing: border-box;
        }
        .side-btn img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .side-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.8);
        }
        /* Center Area wrapper to stack multiple cards vertically */
        .center-wrapper {
            flex: 1;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        /* Main Content Container */
        .content {
            display: flex;
            width: 100%;
            box-sizing: border-box;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            width: 100%;
            position: relative;
            box-sizing: border-box;
        }
        /* Card Top-Right Icon */
        .card-icon {
            position: absolute;
            top: 25px;
            right: 25px;
            width: 50px;
            height: 50px;
            object-fit: contain;
        }
        h1 { margin-top: 0; font-size: 2.5rem; }
        p { font-size: 1.2rem; opacity: 0.9; }

        /* Row layout for multiple cards side by side (like your bottom drawing) */
        .cards-row {
            display: flex;
            gap: 20px;
            width: 100%;
            box-sizing: border-box;
        }
        .card-small {
            flex: 1;
        }
        .card-large {
            flex: 2;
        }
    </style>
</head>
<body>
    <!-- Top Bar -->
    <nav class="navbar" id="navbar">
        <div class="nav-left">
            <img src="icon.png" alt="Site Logo">
            <span>AMPM's Hub</span>
        </div>
        <div class="nav-center">
            <a href="#home">Home</a>
            <a href="#test">Test</a>
        </div>
        <div class="nav-right"></div>
    </nav>

    <!-- Main Container with Side Columns and Center Cards -->
    <div class="main-container">
        <!-- Left Side Buttons -->
        <div class="side-column">
            <a href="https://www.youtube.com/@almohtarampromax" target="_blank" class="side-btn">
                <img src="Youtube.gif" alt="Button 1 GIF">
            </a>
            <a href="https://guns.lol/almohtarampromax" target="_blank" class="side-btn">
                <img src="guns.gif" alt="Button 2 GIF">
            </a>
        </div>

        <!-- Center Wrapper for Stacked Cards -->
        <div class="center-wrapper" id="home">
            <!-- Original Top Card -->
            <div class="content">
                <div class="card">
                    <img src="icon.png" alt="Card Icon" class="card-icon">
                    <h1>Welcome to My Website.</h1>
                    <p>I'm Mohtaram, born in 2010 and I'm from Tunisia. I like drawing and animating in 2D or 3D and i wish to work and become a programmer in the future.</p>
                </div>
            </div>

            <!-- New Additional Boxes Row (Matching your drawing layout) -->
            <div class="cards-row">
                <div class="card card-small">
                    <h2>Box 1</h2>
                    <p>Add your content here!</p>
                </div>
                <div class="card card-large">
                    <h2>Box 2</h2>
                    <p>Add your larger content or description here!</p>
                </div>
            </div>
        </div>

        <!-- Right Side Buttons -->
        <div class="side-column">
            <a href="https://x.com/AlMohtaram_YT" target="_blank" class="side-btn">
                <img src="Twitter.gif" alt="Button 3 GIF">
            </a>
            <a href="https://discord.com" target="_blank" class="side-btn">
                <img src="discord.gif" alt="Button 4 GIF">
            </a>
        </div>
    </div>

    <!-- JavaScript to handle the smart scroll hide/show effect for the navbar -->
    <script>
        let lastScrollTop = 0;
        const navbar = document.getElementById("navbar");

        window.addEventListener("scroll", function() {
            let scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            
            if (scrollTop > lastScrollTop && scrollTop > 50) {
                navbar.classList.add("navbar-hidden");
            } else {
                navbar.classList.remove("navbar-hidden");
            }
            lastScrollTop = scrollTop <= 0 ? 0 : scrollTop;
        });
    </script>
</body>
</html>
