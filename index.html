<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMPM's Hub</title>
    <link rel="icon" type="image/png" href="icon.png">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #4A3525 0%, #2C1D11 100%);
            color: white;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
        }
        /* Top Navigation Bar */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 25px;
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            width: 100%;
            box-sizing: border-box;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
        }
        .nav-left {
            display: flex;
            align-items: center;
        }
        .navbar img {
            width: 48px;
            height: 48px;
            margin-right: 12px;
            object-fit: contain;
        }
        .navbar span {
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
        /* Center Buttons */
        .nav-center {
            display: flex;
            gap: 15px;
        }
        .nav-center a {
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            transition: 0.3s ease;
            font-size: 0.95rem;
        }
        .nav-center a:hover {
            background: rgba(255, 255, 255, 0.25);
        }
        /* Right Spacer */
        .nav-right {
            width: 150px;
        }
        /* Main Content Container */
        .content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding-top: 80px;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        h1 { margin-top: 0; font-size: 2.5rem; }
        p { font-size: 1.2rem; opacity: 0.9; }
    </style>
</head>
<body>
    <!-- Top Bar -->
    <nav class="navbar">
        <div class="nav-left">
            <img src="icon.png" alt="Site Logo">
            <span>AMPM's Hub</span>
        </div>
        <div class="nav-center">
            <a href="#home">Home</a>
            <a href="#test">Test</a>
        </div>
        <div class="nav-right"></div>
    </nav>

    <!-- Center Content -->
    <div class="content">
        <div class="card">
            <h1>Welcome to AMPM's Hub! 🚀</h1>
            <p>Built with GitHub Pages and looking fresh.</p>
        </div>
    </div>
</body>
</html>
